plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'mdt-instance'

// MDT 공통 라이브러리 버전 카탈로그 (mdt-client/gradle/libs.versions.toml)
dependencyResolutionManagement {
	versionCatalogs {
		libs { from(files('../mdt-client/gradle/libs.versions.toml')) }
	}
}

include ':utils'
project(':utils').projectDir = file('../../common/utils')

include ':mdt-client'
project(':mdt-client').projectDir = file('../mdt-client')

include ':mdt-robot-client'
project(':mdt-robot-client').projectDir = file('../mdt-robot-client')

//include ':faaast-starter-3'
//project(':faaast-starter-3').projectDir = file('../faaast/faaast-starter-3')
