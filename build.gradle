plugins {
	id 'java'
	id 'application'
	// id 'com.github.johnrengelman.shadow' version '8.1.1'
	id("com.gradleup.shadow") version "9.3.0"
	id 'eclipse'
}

group = 'etri'
version = System.getenv("MDT_BUILD_VERSION") ?: "unknown"

application {
	mainClass = 'mdt.MDTInstanceMain'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	all {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
	// shadowJar에서 runtimeClasspath보다 먼저 담을 라이브러리 (아래 shadowJar 설정 참고).
	shadowFirst {
		transitive = false
	}
}

repositories {
	mavenCentral()
}
dependencies {
	implementation project(":utils")
	implementation project(":mdt-client")
	implementation project(":mdt-robot-client")
	// implementation project(":faaast-starter-3")
	implementation libs.faaast.starter
	
	// @Nullable, @GuardedBy
	compileOnly libs.findbugs.jsr305
	
	implementation libs.logback.classic

	// Guava (from the project :utils)
	implementation libs.guava

	// Lombok (from the project :utils)
	compileOnly libs.lombok
	annotationProcessor libs.lombok
	
	// jackson json parser
	implementation libs.jackson.datatype.jsr310
	
	// AAS model
	implementation libs.aas4j.dataformat.json
	
	// commons-logging은 configurations.all에서 일괄 제외한다.
	implementation libs.commons.beanutils
		
	// picocli command line parser
	implementation libs.picocli
		
	// HTTP Client
	implementation libs.okhttp
	
	// Hibernate
	implementation libs.hibernate.core
	implementation libs.hikaricp
	shadowFirst libs.hikaricp
	
	// PostgreSQL
	implementation libs.postgresql
	
	// MariaDB
	implementation libs.mariadb
	
	// Apache libraries (utils도 같은 버전을 api로 제공한다)
	implementation libs.commons.text
	
	// MQTT
	implementation libs.paho.mqttv3
	
	// OPC UA client
	implementation libs.milo.sdk.client
	
	// Spring Framework
	implementation libs.spring.data.jpa
	
	testImplementation libs.junit4
	testImplementation libs.okhttp.mockwebserver
	testImplementation libs.mockito.core
	testRuntimeOnly libs.junit.platform.launcher
	testRuntimeOnly libs.junit.vintage.engine
}

test {
	useJUnitPlatform()
}

tasks.named('jar') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
	zip64 = true
	mergeServiceFiles()
	
	// FA³ST starter는 HikariCP 2.4.7 등을 클래스째 품은 fat jar이다. 같은 클래스가 겹치면 먼저 담긴 쪽이 남는데,
	// starter가 HikariCP 5.x보다 먼저 담기면 utils.jdbc.JdbcConnectionPools가 쓰는 API가 없어
	// NoSuchMethodError(HikariConfig.setInitializationFailTimeout)가 난다. HikariCP를 먼저 담아 5.x가 남게 한다.
	configurations = [project.configurations.shadowFirst, project.configurations.runtimeClasspath]
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
}

eclipse {
	classpath {
		file {
			whenMerged { cp ->
				def linkedProjectBuildLibDirs = []
				if (cp.entries.any { it.kind == 'src' && it.path == '/mdt-client' }) {
					linkedProjectBuildLibDirs << project(':mdt-client').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				if (cp.entries.any { it.kind == 'src' && it.path == '/mdt-robot-client' }) {
					linkedProjectBuildLibDirs << project(':mdt-robot-client').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				if (cp.entries.any { it.kind == 'src' && it.path == '/utils' }) {
					linkedProjectBuildLibDirs << project(':utils').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				cp.entries.removeAll { entry ->
					entry.kind == 'lib'
						&& entry.path != null
						&& linkedProjectBuildLibDirs.any { dir -> entry.path.startsWith(dir + '/') }
				}
				cp.entries.each { entry ->
					if (entry.kind == 'src' && entry.path == 'src/main/resources') {
						entry.excludes = []
					}
					if (entry.kind == 'src' && entry.path == 'src/test/resources') {
						entry.excludes = []
					}
				}
			}
		}
	}
}
