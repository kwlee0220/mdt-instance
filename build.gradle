plugins {
	id 'java'
	id 'application'
	// id 'com.github.johnrengelman.shadow' version '8.1.1'
	id("com.gradleup.shadow") version "9.3.0"
	id 'eclipse'
}

group = 'etri'
version = System.getenv("MDT_BUILD_VERSION") ?: "unknown"

application {
	mainClass = 'mdt.MDTInstanceMain'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	all {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
	// shadowJar에서 runtimeClasspath보다 먼저 담을 라이브러리 (아래 shadowJar 설정 참고).
	shadowFirst {
		transitive = false
	}
}

repositories {
	mavenCentral()
}
ext {
	faaast_version = '1.3.0'
}
dependencies {
	implementation project(":utils")
	implementation project(":mdt-client")
	implementation project(":mdt-robot-client")
	// implementation project(":faaast-starter-3")
	implementation "de.fraunhofer.iosb.ilt.faaast.service:starter:${faaast_version}"
	
	// @Nullable, @GuardedBy
	compileOnly "com.google.code.findbugs:jsr305:${findbugs_version}"
	
	implementation "ch.qos.logback:logback-classic:${logback_version}"

	// Guava (from the project :utils)
	implementation "com.google.guava:guava:${guava_version}"

	// Lombok (from the project :utils)
	compileOnly "org.projectlombok:lombok:${lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${lombok_version}"
	
//	implementation "net.bytebuddy:byte-buddy:${byte_buddy_version}"

	// jackson json parser
	implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jackson_version}"
	
	// AAS model
	implementation "org.eclipse.digitaltwin.aas4j:aas4j-dataformat-json:${aas4j_version}"
	
	implementation ("commons-beanutils:commons-beanutils:${commons_beanutils_version}") {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
		
	// picocli command line parser
	implementation "info.picocli:picocli:${picocli_version}"
		
	// HTTP Client
	implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: "${okhttp_version}"
	
	// Hibernate
	implementation "org.hibernate.orm:hibernate-core:${hibernate_version}"
	implementation "com.zaxxer:HikariCP:${hikaricp_version}"
	shadowFirst "com.zaxxer:HikariCP:${hikaricp_version}"
	
	// PostgreSQL
	implementation "org.postgresql:postgresql:${postgresql_version}"
	
	// MariaDB
	implementation "org.mariadb.jdbc:mariadb-java-client:${mariadb_version}"
	
	// Apache libraries
	implementation "org.apache.commons:commons-text:${commons_text_version}"
	
	// MQTT
	implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:${paho_version}"
	
	// OPC UA client
	implementation "org.eclipse.milo:sdk-client:${milo_version}"
	
	// WebSocket
	implementation "org.java-websocket:Java-WebSocket:${websocket_version}"
	
	// Spring Framework
	implementation "org.springframework.data:spring-data-jpa:${spring_data_version}"
	
	testImplementation "junit:junit:${junit_version}"
	testImplementation "com.squareup.okhttp3:mockwebserver:${okhttp_version}"
	testImplementation "org.mockito:mockito-core:${mockito_version}"
	testImplementation "org.junit.platform:junit-platform-launcher:${junit_jupiter_version}"
	testRuntimeOnly "org.junit.vintage:junit-vintage-engine:${junit_jupiter_version}"
}

task sourceJar(type: Jar) {
	from sourceSets.main.allSource
}

test {
	useJUnitPlatform()
}

tasks.named('jar') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
	zip64 = true
	mergeServiceFiles()
	
	// FA³ST starter는 HikariCP 2.4.7 등을 클래스째 품은 fat jar이다. 같은 클래스가 겹치면 먼저 담긴 쪽이 남는데,
	// starter가 HikariCP 5.x보다 먼저 담기면 utils.jdbc.JdbcConnectionPools가 쓰는 API가 없어
	// NoSuchMethodError(HikariConfig.setInitializationFailTimeout)가 난다. HikariCP를 먼저 담아 5.x가 남게 한다.
	configurations = [project.configurations.shadowFirst, project.configurations.runtimeClasspath]
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
}

eclipse {
	classpath {
		file {
			whenMerged { cp ->
				def linkedProjectBuildLibDirs = []
				if (cp.entries.any { it.kind == 'src' && it.path == '/mdt-client' }) {
					linkedProjectBuildLibDirs << project(':mdt-client').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				if (cp.entries.any { it.kind == 'src' && it.path == '/mdt-robot-client' }) {
					linkedProjectBuildLibDirs << project(':mdt-robot-client').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				if (cp.entries.any { it.kind == 'src' && it.path == '/utils' }) {
					linkedProjectBuildLibDirs << project(':utils').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				}
				cp.entries.removeAll { entry ->
					entry.kind == 'lib'
						&& entry.path != null
						&& linkedProjectBuildLibDirs.any { dir -> entry.path.startsWith(dir + '/') }
				}
				cp.entries.each { entry ->
					if (entry.kind == 'src' && entry.path == 'src/main/resources') {
						entry.excludes = []
					}
					if (entry.kind == 'src' && entry.path == 'src/test/resources') {
						entry.excludes = []
					}
				}
			}
		}
	}
}
